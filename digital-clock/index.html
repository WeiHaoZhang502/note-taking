<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多时区数字时钟 - Digital Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🕐 全球时钟</h1>
            <p class="subtitle">Global Time Zone Clock</p>
        </header>

        <div class="control-panel">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="搜索时区... Search timezone..."
                    class="search-input"
                >
            </div>
            <div class="button-group">
                <button id="addBtn" class="btn btn-primary">+ 添加时区</button>
                <button id="resetBtn" class="btn btn-secondary">重置</button>
                <button id="toggleFormatBtn" class="btn btn-secondary">12/24 小时</button>
            </div>
        </div>

        <div class="clocks-grid" id="clocksContainer">
            <!-- Clocks will be inserted here -->
        </div>

        <div class="modal" id="timezoneModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>选择时区</h2>
                    <button class="close-btn" id="closeModalBtn">&times;</button>
                </div>
                <div class="modal-body">
                    <input 
                        type="text" 
                        id="modalSearchInput" 
                        placeholder="搜索时区..."
                        class="modal-search"
                    >
                    <div class="timezone-list" id="timezoneList">
                        <!-- Timezones will be inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
